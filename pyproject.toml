[project]
name = "photogram-data-prep"
version = "0.5.1"
description = "Turns raw drone and camera data into the dataset format read by the photogrammetry pipeline"
readme = "README.md"
authors = [
    { name = "Ibad Rather", email = "ibad.rather.ir@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=4.12",
    "pillow>=13.0.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
photogram-data-prep = "photogram_data_prep.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
